# Builds the Tauri installers (Windows: NSIS .exe + MSI; macOS: universal
# .dmg). Runs only for releases and on demand — running on every master push
# and PR would burn the monthly Actions allowance (the macOS runner
# especially):
# - Pushing a tag like v1.2.0: builds and publishes a GitHub release.
# - Actions > Build installers > Run workflow: a build-only test (blank
#   version), or a release (see below).
# - Manual release (version set): a prep job bumps Cargo.toml, Cargo.lock,
#   tauri.conf.json and package.json, pushes the commit and a v<version> tag,
#   then the build jobs build that commit and publish the release — all in
#   one run. (A tag pushed by GITHUB_TOKEN can't trigger a second workflow
#   run.)
#
# macOS signing/notarization uses these repo secrets (same names as the
# Trippin repo, which tauri build reads natively):
#   APPLE_CERTIFICATE, APPLE_CERTIFICATE_PASSWORD, APPLE_SIGNING_IDENTITY,
#   APPLE_ID, APPLE_PASSWORD, APPLE_TEAM_ID
# Missing secrets leave the build running but unsigned.
name: Build installers

on:
  push:
    tags: ["v*"]
  workflow_dispatch:
    inputs:
      release_version:
        description: "Version to release, e.g. 1.3.0 (blank = build only)"
        required: false
      prerelease:
        description: "Mark as a pre-release"
        type: boolean
        default: false

permissions:
  contents: write

# A newer run for the same ref replaces one still in progress.
concurrency:
  group: build-${{ github.ref }}
  cancel-in-progress: true

jobs:
  # Manual releases bump the version in every file that carries it and push a
  # tag, so both platform builds embed the same version. On tag pushes and
  # build-only runs this job is skipped and the builds use github.sha as-is.
  prep:
    runs-on: ubuntu-latest
    if: ${{ github.event_name == 'workflow_dispatch' && inputs.release_version != '' }}
    outputs:
      sha: ${{ steps.bump.outputs.sha }}
      version: ${{ steps.bump.outputs.version }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4

      - name: Bump version, commit and tag
        id: bump
        run: |
          set -e
          v="${{ inputs.release_version }}"; v="${v#v}"
          sed -i "0,/^version = \"[^\"]*\"/s//version = \"$v\"/" rust-app/src-tauri/Cargo.toml
          node -e 'const fs=require("fs"),v=process.argv[1];for(const f of["rust-app/src-tauri/tauri.conf.json","rust-app/package.json"]){const j=JSON.parse(fs.readFileSync(f));j.version=v;fs.writeFileSync(f,JSON.stringify(j,null,2)+"\n")}' "$v"
          (cd rust-app/src-tauri && cargo metadata --format-version 1 --quiet >/dev/null)
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add rust-app/src-tauri/Cargo.toml rust-app/src-tauri/Cargo.lock \
            rust-app/src-tauri/tauri.conf.json rust-app/package.json
          git commit -m "Release v$v [skip ci]"
          git tag "v$v"
          # GITHUB_TOKEN can't bypass "changes via PR" protection on master;
          # pushing the tag alone is enough — it carries the bump commit, and
          # the build jobs check it out by sha. (master then lags the released
          # version until someone merges a bump commit or relaxes the rule.)
          git push origin HEAD:master || echo "::warning::master push blocked by branch protection; releasing from tag only"
          git push origin "v$v"
          echo "sha=$(git rev-parse HEAD)" >> "$GITHUB_OUTPUT"
          echo "version=$v" >> "$GITHUB_OUTPUT"

  build:
    needs: prep
    if: ${{ always() && needs.prep.result != 'failure' }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - platform: macos-latest
            args: --target universal-apple-darwin
          - platform: windows-latest
            args: ""
    runs-on: ${{ matrix.platform }}
    # Secrets can't be referenced in step-level `if:` — evaluate them here
    # once. Missing installer cert leaves the .pkg built but unsigned.
    env:
      HAS_INSTALLER_CERT: ${{ secrets.APPLE_INSTALLER_CERTIFICATE != '' && secrets.APPLE_INSTALLER_SIGNING_IDENTITY != '' }}
      HAS_NOTARY: ${{ secrets.APPLE_ID != '' && secrets.APPLE_PASSWORD != '' && secrets.APPLE_TEAM_ID != '' }}
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ needs.prep.outputs.sha || github.sha }}

      - uses: actions/setup-node@v4
        with:
          node-version: lts/*
          cache: npm
          cache-dependency-path: rust-app/package-lock.json

      - name: Install Rust
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.platform == 'macos-latest' && 'aarch64-apple-darwin,x86_64-apple-darwin' || '' }}

      - name: Cache cargo
        uses: Swatinem/rust-cache@v2
        with:
          workspaces: rust-app/src-tauri

      - name: Install dependencies
        working-directory: rust-app
        run: npm ci

      - name: Work out version
        id: version
        shell: bash
        run: |
          if [[ "$GITHUB_REF" == refs/tags/v* ]]; then
            v="${GITHUB_REF_NAME#v}"
          elif [[ -n "${{ needs.prep.outputs.version }}" ]]; then
            v="${{ needs.prep.outputs.version }}"
          else
            v="$(node -p "require('./rust-app/src-tauri/tauri.conf.json').version")-build.$GITHUB_RUN_NUMBER"
          fi
          echo "version=$v" >> "$GITHUB_OUTPUT"
          echo "Version: $v"

      # tauri build reads the APPLE_* vars itself: with a certificate +
      # identity it codesigns the bundle, and with the notary creds it
      # submits to Apple and staples before making the .dmg.
      - name: Build
        working-directory: rust-app
        env:
          APPLE_CERTIFICATE: ${{ secrets.APPLE_CERTIFICATE }}
          APPLE_CERTIFICATE_PASSWORD: ${{ secrets.APPLE_CERTIFICATE_PASSWORD }}
          APPLE_SIGNING_IDENTITY: ${{ secrets.APPLE_SIGNING_IDENTITY }}
          APPLE_ID: ${{ secrets.APPLE_ID }}
          APPLE_PASSWORD: ${{ secrets.APPLE_PASSWORD }}
          APPLE_TEAM_ID: ${{ secrets.APPLE_TEAM_ID }}
        run: npx tauri build ${{ matrix.args }}

      # A "Developer ID Installer" certificate (separate from the app's
      # "Developer ID Application" one) signs the .pkg for Intune/MDM
      # deployment. Without it the package is still built, unsigned; the
      # app inside stays signed and notarized either way.
      - name: Import installer signing certificate
        if: runner.os == 'macOS' && env.HAS_INSTALLER_CERT == 'true'
        working-directory: rust-app
        env:
          APPLE_INSTALLER_CERTIFICATE: ${{ secrets.APPLE_INSTALLER_CERTIFICATE }}
          APPLE_INSTALLER_CERTIFICATE_PASSWORD: ${{ secrets.APPLE_INSTALLER_CERTIFICATE_PASSWORD }}
        run: |
          security create-keychain -p "" build.keychain
          security default-keychain -s build.keychain
          security unlock-keychain -p "" build.keychain
          echo "$APPLE_INSTALLER_CERTIFICATE" | base64 --decode > installer.p12
          security import installer.p12 -k build.keychain \
            -P "$APPLE_INSTALLER_CERTIFICATE_PASSWORD" -T /usr/bin/productbuild -T /usr/bin/productsign
          security set-key-partition-list -S apple-tool:,apple: -s -k "" build.keychain
          rm installer.p12
          # G2 Developer ID certs only validate with Apple's G2 intermediate
          # in the chain; runners don't reliably carry it.
          curl -fsSL -o DeveloperIDG2CA.cer https://www.apple.com/certificateauthority/DeveloperIDG2CA.cer
          security import DeveloperIDG2CA.cer -k build.keychain || true
          rm DeveloperIDG2CA.cer
          security find-identity -v build.keychain

      # The installer: always to /Applications (not relocatable, so it never
      # "upgrades" a stray copy elsewhere instead), preinstall quits the app
      # and removes the old bundle so upgrades are clean.
      - name: Build installer package
        if: runner.os == 'macOS'
        working-directory: rust-app
        env:
          APPLE_INSTALLER_SIGNING_IDENTITY: ${{ secrets.APPLE_INSTALLER_SIGNING_IDENTITY }}
        run: |
          set -e
          V="${{ steps.version.outputs.version }}"
          APP=$(find src-tauri/target -path '*/release/bundle/macos/*.app' | head -1)
          echo "Packaging $APP"
          mkdir -p pkgroot
          ditto "$APP" "pkgroot/$(basename "$APP")"
          chmod 755 installer/macos/scripts/preinstall
          pkgbuild --analyze --root pkgroot component.plist
          plutil -replace 0.BundleIsRelocatable -bool NO component.plist
          plutil -replace 0.BundleOverwriteAction -string upgrade component.plist
          pkgbuild --root pkgroot --component-plist component.plist \
            --identifier com.bookmarkmanager.gpo --version "$V" \
            --install-location /Applications \
            --scripts installer/macos/scripts \
            BookmarkManager-component.pkg
          sed "s/__VERSION__/$V/" installer/macos/distribution.xml > distribution.xml
          if [ "$HAS_INSTALLER_CERT" = "true" ]; then
            productbuild --distribution distribution.xml --package-path . \
              --sign "$APPLE_INSTALLER_SIGNING_IDENTITY" --timestamp \
              "Bookmark-Manager-macOS-$V.pkg"
            pkgutil --check-signature "Bookmark-Manager-macOS-$V.pkg"
          else
            productbuild --distribution distribution.xml --package-path . \
              "Bookmark-Manager-macOS-$V.pkg"
          fi
          rm BookmarkManager-component.pkg

      - name: Notarize and staple installer
        if: runner.os == 'macOS' && env.HAS_INSTALLER_CERT == 'true' && env.HAS_NOTARY == 'true'
        working-directory: rust-app
        env:
          APPLE_ID: ${{ secrets.APPLE_ID }}
          APPLE_PASSWORD: ${{ secrets.APPLE_PASSWORD }}
          APPLE_TEAM_ID: ${{ secrets.APPLE_TEAM_ID }}
        run: |
          P="Bookmark-Manager-macOS-${{ steps.version.outputs.version }}.pkg"
          xcrun notarytool submit "$P" \
            --apple-id "$APPLE_ID" \
            --password "$APPLE_PASSWORD" \
            --team-id "$APPLE_TEAM_ID" \
            --wait
          xcrun stapler staple "$P"
          xcrun stapler validate "$P"

      - name: Remove signing keychain
        if: runner.os == 'macOS' && always() && env.HAS_INSTALLER_CERT == 'true'
        run: security delete-keychain build.keychain || true

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: Bookmark-Manager-${{ runner.os }}-${{ steps.version.outputs.version }}
          retention-days: 3
          path: |
            rust-app/Bookmark-Manager-macOS-*.pkg
            rust-app/src-tauri/target/**/release/bundle/dmg/*.dmg
            rust-app/src-tauri/target/**/release/bundle/msi/*.msi
            rust-app/src-tauri/target/**/release/bundle/nsis/*.exe

      - name: Publish release (tags and manual releases)
        if: ${{ startsWith(github.ref, 'refs/tags/v') || needs.prep.result == 'success' }}
        uses: softprops/action-gh-release@v2
        with:
          files: |
            rust-app/Bookmark-Manager-macOS-*.pkg
            rust-app/src-tauri/target/**/release/bundle/dmg/*.dmg
            rust-app/src-tauri/target/**/release/bundle/msi/*.msi
            rust-app/src-tauri/target/**/release/bundle/nsis/*.exe
          tag_name: ${{ startsWith(github.ref, 'refs/tags/v') && github.ref_name || format('v{0}', inputs.release_version) }}
          prerelease: ${{ github.event_name == 'workflow_dispatch' && inputs.prerelease }}
          generate_release_notes: true
